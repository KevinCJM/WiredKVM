[package]
name = "wiredkvm-mt2-protocol-draft"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
wiredkvm-cable-image = { path = "../../native/cable-image", optional = true }

[features]
default = []
c-abi = []
native-mt2 = []
ram-setup = ["dep:wiredkvm-cable-image"]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
